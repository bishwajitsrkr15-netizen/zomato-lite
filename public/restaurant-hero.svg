    <circle cx="535" cy="134" r="26" fill="#7f1012"/>
    <circle cx="530" cy="120" r="6" fill="#a63a28" opacity="0.9"/>
    <circle cx="545" cy="140" r="4.5" fill="#a63a28" opacity="0.9"/>
